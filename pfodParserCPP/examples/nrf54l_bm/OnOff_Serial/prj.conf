# nRF Connect SDK Bare Metal configuration for the OnOff_Serial example.
# The bm_ board defconfig already disables multithreading, starts the GRTC
# SYSCOUNTER (used by micros()) and enables the nrfx UARTE driver.

# C++ (pfodParserCPP). C++20 so the nrfx designated initializer macros
# (NRFX_UARTE_DEFAULT_CONFIG, NRFX_UARTE_INSTANCE) are standard C++.
CONFIG_CPP=y
CONFIG_STD_CPP20=y

# Clock control, as in the Bare Metal UARTE sample
CONFIG_CLOCK_CONTROL=y

# The SoftDevice is not needed for the serial connection, but the bm_ boards
# are SoftDevice boards, as in the Bare Metal UARTE sample.
CONFIG_SOFTDEVICE=y

# The full C++ library (libstdc++), pfodParserCPP's pfodDwgs.cpp includes <cmath>,
# which Zephyr's minimal C++ library does not have.
CONFIG_REQUIRES_FULL_LIBCPP=y
