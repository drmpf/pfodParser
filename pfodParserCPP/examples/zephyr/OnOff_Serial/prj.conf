# Zephyr configuration for the OnOff_Serial example.

# C++ (pfodParserCPP). C++20 so the devicetree designated initializer macros
# (GPIO_DT_SPEC_GET) are standard C++.
CONFIG_CPP=y
CONFIG_STD_CPP20=y

# The interrupt driven UART API used by target_Stream.cpp
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# The output pin, target_Pin.cpp
CONFIG_GPIO=y

# main.cpp uses the console UART (DT_CHOSEN(zephyr_console)) for the pfod connection,
# so stop Zephyr writing the boot banner, log and printk output to it, which would
# corrupt the pfod messages. printk output (e.g. target_PinInit errors) is then lost,
# unless you send the console somewhere else, e.g. the SEGGER RTT on Nordic DKs with
#   CONFIG_USE_SEGGER_RTT=y and CONFIG_RTT_CONSOLE=y
# Remove these if you change main.cpp to use a dedicated UART.
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_LOG=n

# The full C++ library (libstdc++), pfodParserCPP's pfodDwgs.cpp includes <cmath>,
# which Zephyr's minimal C++ library does not have.
CONFIG_REQUIRES_FULL_LIBCPP=y
